<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Einkauf</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="theme-color-meta" content="#22c55e">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3737/3737372.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #22c55e; /* Standard: Grün */
        }
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            padding-bottom: 80px; /* Platz für Nav */
            -webkit-tap-highlight-color: transparent;
        }
        .ios-safe-area {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .nav-item.active {
            color: var(--primary-color);
        }
        .hidden-section { display: none; }
        
        /* Spinner Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid var(--primary-color);
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Workshop Challenge Banner -->
    <div id="workshop-banner" class="bg-yellow-100 border-b border-yellow-200 p-4 mb-4">
        <div class="flex justify-between items-center">
            <div>
                <h3 class="font-bold text-yellow-800 text-sm">🛠 Workshop Challenge</h3>
                <p class="text-xs text-yellow-700">Mach diese App zu DEINER App! Ändere Name, Farbe & KI.</p>
            </div>
            <button onclick="document.getElementById('workshop-banner').remove()" class="text-yellow-800 text-xl">&times;</button>
        </div>
    </div>

    <!-- Header -->
    <header class="p-6">
        <h1 id="app-title" class="text-3xl font-extrabold text-gray-800">Smart Einkauf</h1>
        <p id="app-greeting" class="text-gray-500">Hallo! Was steht heute an?</p>
    </header>

    <main class="px-4">
        <!-- 1. Bereich: Einkauf -->
        <section id="section-einkauf">
            <div class="flex gap-2 mb-6">
                <input type="text" id="item-input" placeholder="Artikel hinzufügen..." class="flex-1 p-3 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-green-500 outline-none">
                <button onclick="addItem()" class="bg-primary text-white p-3 rounded-xl px-5">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div id="shopping-list" class="space-y-3">
                <!-- Items werden hier gerendert -->
            </div>
            
            <div class="mt-8">
                <button onclick="askGeminiForRecipes()" class="w-full bg-white border-2 border-primary text-primary font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform">
                    <i class="fas fa-utensils"></i> Was kann ich daraus kochen?
                </button>
            </div>
        </section>

        <!-- 2. Bereich: KI-Assistent -->
        <section id="section-ki" class="hidden-section">
            <div class="card p-4 mb-4 min-h-[200px] flex flex-col">
                <div id="chat-output" class="flex-1 text-gray-700 text-sm overflow-y-auto mb-4 space-y-4">
                    <div class="bg-gray-100 p-3 rounded-lg">✨ Frag mich etwas über deine Einkäufe oder Ernährung!</div>
                </div>
                <div id="ai-loading" class="hidden flex items-center gap-2 text-primary text-sm mb-2">
                    <div class="loader"></div> Gemini denkt nach...
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Frage stellen..." class="flex-1 p-3 bg-gray-50 rounded-xl outline-none border-none">
                    <button onclick="sendChat()" class="bg-primary text-white p-3 rounded-xl">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 3. Bereich: Ideen -->
        <section id="section-ideen" class="hidden-section">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="quickAction('Schnelles Abendessen')" class="card p-4 text-left">
                    <div class="text-2xl mb-2">⏱️</div>
                    <div class="font-bold">Schnell</div>
                </button>
                <button onclick="quickAction('Gesunde Alternativen')" class="card p-4 text-left">
                    <div class="text-2xl mb-2">🥗</div>
                    <div class="font-bold">Gesund</div>
                </button>
                <button onclick="quickAction('Günstig einkaufen')" class="card p-4 text-left">
                    <div class="text-2xl mb-2">💶</div>
                    <div class="font-bold">Günstig</div>
                </button>
                <button onclick="quickAction('Proteinreiche Mahlzeit')" class="card p-4 text-left">
                    <div class="text-2xl mb-2">💪</div>
                    <div class="font-bold">Protein</div>
                </button>
            </div>
            <div id="ideas-output" class="mt-4"></div>
        </section>

        <!-- 4. Bereich: Einstellungen -->
        <section id="section-settings" class="hidden-section">
            <div class="card p-6">
                <h2 class="font-bold mb-4">Meine Prioritäten</h2>
                <div id="preferences" class="space-y-3">
                    <!-- Präferenzen als Checkboxen -->
                    <label class="flex items-center justify-between p-2 border-b">
                        <span>Gesünder</span>
                        <input type="checkbox" value="Gesund" class="w-5 h-5 accent-green-500" onchange="savePrefs()">
                    </label>
                    <label class="flex items-center justify-between p-2 border-b">
                        <span>Vegetarisch</span>
                        <input type="checkbox" value="Vegetarisch" class="w-5 h-5 accent-green-500" onchange="savePrefs()">
                    </label>
                    <label class="flex items-center justify-between p-2 border-b">
                        <span>Günstiger</span>
                        <input type="checkbox" value="Günstig" class="w-5 h-5 accent-green-500" onchange="savePrefs()">
                    </label>
                    <label class="flex items-center justify-between p-2 border-b">
                        <span>Proteinreich</span>
                        <input type="checkbox" value="Protein" class="w-5 h-5 accent-green-500" onchange="savePrefs()">
                    </label>
                </div>
                
                <div class="mt-8 p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                    <p class="text-xs text-gray-400 mb-2 italic text-center">Entwickler-Optionen</p>
                    <input type="password" id="api-key" placeholder="Gemini API Key einfügen" class="w-full p-2 text-xs rounded border">
                </div>
            </div>
        </section>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 ios-safe-area shadow-lg">
        <button onclick="showSection('einkauf')" class="nav-item active flex flex-col items-center gap-1">
            <i class="fas fa-shopping-basket text-xl"></i>
            <span class="text-[10px] font-medium">Einkauf</span>
        </button>
        <button onclick="showSection('ki')" class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-robot text-xl"></i>
            <span class="text-[10px] font-medium">Assistent</span>
        </button>
        <button onclick="showSection('ideen')" class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-lightbulb text-xl"></i>
            <span class="text-[10px] font-medium">Ideen</span>
        </button>
        <button onclick="showSection('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-[10px] font-medium">Setup</span>
        </button>
    </nav>

    <!-- Modals & Overlays -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 max-h-[80vh] overflow-y-auto">
            <div id="modal-content"></div>
            <button onclick="closeModal()" class="w-full mt-6 py-3 bg-gray-100 rounded-xl font-bold">Schließen</button>
        </div>
    </div>

    <script>
        /* --- KONFIGURATION & STATE --- */
        let state = {
            items: JSON.parse(localStorage.getItem('items')) || [
                { id: 1, name: 'Milch', checked: false, category: 'Milchprodukte' },
                { id: 2, name: 'Äpfel', checked: false, category: 'Obst & Gemüse' },
                { id: 3, name: 'Cola', checked: false, category: 'Getränke' },
                { id: 4, name: 'Brot', checked: true, category: 'Brot & Getreide' }
            ],
            prefs: JSON.parse(localStorage.getItem('prefs')) || [],
            apiKey: localStorage.getItem('gemini_key') || ''
        };

        /* --- UI NAVIGATION --- */
        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById('section-' + id).classList.remove('hidden-section');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active', 'text-primary'));
            event.currentTarget.classList.add('active', 'text-primary');
        }

        /* --- EINKAUFSLISTE FUNKTIONEN --- */
        function renderItems() {
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            
            // Sortierung: Ungeprüft oben
            const sortedItems = [...state.items].sort((a, b) => a.checked - b.checked);

            sortedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `card p-4 flex items-center gap-3 transition-all ${item.checked ? 'opacity-50' : ''}`;
                div.innerHTML = `
                    <input type="checkbox" ${item.checked ? 'checked' : ''} 
                        onclick="toggleItem(${item.id})" 
                        class="w-6 h-6 accent-green-500 rounded-lg">
                    <div class="flex-1">
                        <p class="font-bold ${item.checked ? 'line-through' : ''}">${item.name}</p>
                        <p class="text-[10px] text-gray-400 uppercase tracking-wide">${item.category || 'Sonstiges'}</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="getAlternative('${item.name}')" class="text-primary text-sm"><i class="fas fa-exchange-alt"></i></button>
                        <button onclick="deleteItem(${item.id})" class="text-red-300"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
            localStorage.setItem('items', JSON.stringify(state.items));
        }

        function addItem() {
            const input = document.getElementById('item-input');
            if (!input.value) return;
            state.items.unshift({
                id: Date.now(),
                name: input.value,
                checked: false,
                category: 'Sonstiges'
            });
            input.value = '';
            renderItems();
        }

        function toggleItem(id) {
            const item = state.items.find(i => i.id === id);
            item.checked = !item.checked;
            renderItems();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            renderItems();
        }

        /* --- KI INTEGRATION (GEMINI) --- */
        async function callGemini(prompt) {
            const apiKey = document.getElementById('api-key').value || state.apiKey;
            if (!apiKey) {
                return { error: "Kein API-Key", fallback: true };
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Du bist ein hilfreicher Einkaufs-Assistent. 
                            Berücksichtige diese Benutzer-Präferenzen: ${state.prefs.join(', ')}.
                            Aktuelle Einkaufsliste: ${state.items.filter(i => !i.checked).map(i => i.name).join(', ')}.
                            Antworte kurz, freundlich und formatiere mit Emojis.
                            Nutze für Listen einfache Spiegelstriche.
                            ${prompt}` }] }]
                    })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                console.error(e);
                return { fallback: true };
            }
        }

        async function getAlternative(itemName) {
            openModal('<div class="flex flex-col items-center p-4"><div class="loader mb-2"></div> Suche gesündere Alternative...</div>');
            
            const prompt = `Schlage eine gesunde oder bessere Alternative für "${itemName}" vor. Erkläre kurz warum (max 2 Sätze). Zeige auch eine Bewertung: 🟢, 🟡 oder 🔴.`;
            const result = await callGemini(prompt);
            
            if (result.fallback) {
                // Lokaler Fallback
                const fallbacks = { "Cola": "Wasser mit Zitrone 🟢", "Brot": "Vollkornbrot 🟢", "Chips": "Nüsse 🟡" };
                openModal(`<h3>Alternative für ${itemName}</h3><p class='mt-4'>${fallbacks[itemName] || 'Wasser oder frisches Obst 🟢'}</p><p class='text-xs mt-2 italic'>KI momentan nicht erreichbar - lokaler Vorschlag.</p>`);
            } else {
                openModal(`
                    <div class="text-center mb-4">✨ Gemini Empfehlung</div>
                    <div class="text-lg font-bold mb-2">${itemName} ersetzen durch:</div>
                    <div class="p-4 bg-green-50 rounded-xl text-gray-700">${result}</div>
                    <p class="text-[10px] text-gray-400 mt-4">Hinweis: Keine medizinische Beratung.</p>
                `);
            }
        }

        async function askGeminiForRecipes() {
            openModal('<div class="flex flex-col items-center p-4"><div class="loader mb-2"></div> Erstelle Rezeptvorschläge...</div>');
            const prompt = "Schlage 3 einfache Gerichte basierend auf meiner Liste vor. Für jedes Gericht: Name, Zeit, fehlende Zutaten.";
            const result = await callGemini(prompt);
            
            let content = result.fallback ? "Wie wäre es mit Pasta mit Tomatensauce oder einem frischen Apfelsalat?" : result;
            
            openModal(`
                <h3 class="text-xl font-bold mb-4">Rezeptideen</h3>
                <div class="prose prose-sm text-gray-700">${content.replace(/\n/g, '<br>')}</div>
                <button onclick="quickAction('Füge die fehlenden Zutaten aus dem letzten Vorschlag meiner Liste hinzu')" class="w-full mt-4 bg-primary text-white py-3 rounded-xl">Fehlende Zutaten hinzufügen</button>
            `);
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const output = document.getElementById('chat-output');
            const loader = document.getElementById('ai-loading');
            
            if (!input.value) return;
            
            const userMsg = input.value;
            output.innerHTML += `<div class="bg-blue-50 p-3 rounded-lg self-end ml-8 text-right font-medium">${userMsg}</div>`;
            input.value = '';
            loader.classList.remove('hidden');
            
            const result = await callGemini(userMsg);
            loader.classList.add('hidden');
            
            const aiMsg = result.fallback ? "Ich kann gerade nicht nachdenken. Frag mich später nochmal!" : result;
            output.innerHTML += `<div class="bg-gray-100 p-3 rounded-lg mr-8">✨ ${aiMsg}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        async function quickAction(type) {
            showSection('ki');
            document.getElementById('chat-input').value = type;
            sendChat();
        }

        /* --- UTILS --- */
        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function savePrefs() {
            const selected = Array.from(document.querySelectorAll('#preferences input:checked')).map(i => i.value);
            state.prefs = selected;
            localStorage.setItem('prefs', JSON.stringify(selected));
        }

        // API Key Speicherung für den Workshop
        document.getElementById('api-key').addEventListener('change', (e) => {
            localStorage.setItem('gemini_key', e.target.value);
            state.apiKey = e.target.value;
        });

        // Initialisierung
        document.addEventListener('DOMContentLoaded', () => {
            renderItems();
            // Checkboxen setzen
            state.prefs.forEach(p => {
                const cb = document.querySelector(`#preferences input[value="${p}"]`);
                if (cb) cb.checked = true;
            });
            if (state.apiKey) document.getElementById('api-key').value = state.apiKey;
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
