<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Einkauf AI</title>
    
    <!-- Design & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #059669; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-nav { color: var(--primary); transform: translateY(-3px); }
        .hidden { display: none !important; }
        
        /* Smooth List Animations */
        .item-row { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Hide Scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="safe-area-inset-top">

    <!-- TOP HEADER -->
    <header class="fixed top-0 w-full z-50 glass border-b border-gray-100/50 px-6 pt-12 pb-4">
        <div class="flex justify-between items-end">
            <div>
                <p id="app-tag" class="text-[10px] font-black text-emerald-500 uppercase tracking-[0.2em] mb-1">KI Assistent</p>
                <h1 id="app-name" class="text-2xl font-extrabold text-slate-900 tracking-tight">Smart Einkauf</h1>
            </div>
            <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-red-400 mb-2 shadow-[0_0_10px_rgba(248,113,113,0.5)]"></div>
        </div>
    </header>

    <!-- CONTENT AREAS -->
    <main class="pt-32 pb-32 px-5 max-w-lg mx-auto">
        
        <!-- SECTION: LIST -->
        <section id="sec-list" class="space-y-6">
            <!-- Input Area -->
            <div class="relative">
                <input type="text" id="main-input" placeholder="Was musst du kaufen?" 
                    class="w-full p-5 bg-white rounded-[24px] card-shadow border border-gray-100 outline-none focus:ring-2 focus:ring-emerald-500/20 text-slate-700 font-medium transition-all">
                <button onclick="addItem()" class="absolute right-2 top-2 bg-emerald-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-90 transition-transform">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <!-- List -->
            <div id="list-container" class="space-y-3">
                <!-- Items spawn here -->
            </div>

            <!-- AI Quick Actions -->
            <div class="grid grid-cols-2 gap-3 pt-4">
                <button onclick="aiMagic('Rezepte')" class="bg-white border border-emerald-50 p-4 rounded-3xl card-shadow flex items-center justify-center gap-2 text-emerald-600 font-bold text-sm active:scale-95 transition-all">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Rezepte
                </button>
                <button onclick="aiMagic('Check')" class="bg-white border border-emerald-50 p-4 rounded-3xl card-shadow flex items-center justify-center gap-2 text-emerald-600 font-bold text-sm active:scale-95 transition-all">
                    <i data-lucide="leaf" class="w-4 h-4"></i> Gesund?
                </button>
            </div>
        </section>

        <!-- SECTION: CHAT -->
        <section id="sec-ai" class="hidden">
            <div class="bg-white rounded-[32px] card-shadow border border-gray-50 flex flex-col h-[60vh]">
                <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 text-sm">
                    <div class="bg-emerald-50 text-emerald-800 p-4 rounded-2xl rounded-tl-none font-medium">
                        ✨ Hallo! Ich bin dein KI-Begleiter. Frag mich alles zu deiner Liste!
                    </div>
                </div>
                <div id="ai-typing" class="hidden px-6 pb-2 text-[10px] font-bold text-emerald-400 animate-pulse uppercase tracking-widest">Gemini denkt nach...</div>
                <div class="p-4 bg-gray-50 rounded-b-[32px] flex gap-2">
                    <input type="text" id="chat-input" placeholder="Nachricht..." class="flex-1 bg-white p-3 rounded-xl outline-none shadow-inner">
                    <button onclick="sendChat()" class="bg-emerald-500 text-white w-10 h-10 rounded-xl flex items-center justify-center"><i data-lucide="send" class="w-4 h-4"></i></button>
                </div>
            </div>
        </section>

        <!-- SECTION: CUSTOMIZE (WORKSHOP) -->
        <section id="sec-config" class="hidden">
            <div class="bg-white rounded-[32px] p-8 card-shadow space-y-6">
                <h2 class="text-xl font-bold text-slate-800">Workshop Challenge</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">App Name</label>
                        <input type="text" id="cfg-name" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none mt-1 font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Farbe (HEX)</label>
                        <input type="text" id="cfg-color" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">KI-Schlüssel (AIza...)</label>
                        <input type="password" id="cfg-key" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none mt-1 text-xs">
                    </div>
                </div>
                <button onclick="saveConfig()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">Design anwenden</button>
            </div>
        </section>

    </main>

    <!-- TAB BAR -->
    <nav class="fixed bottom-0 w-full glass border-t border-gray-100 flex justify-around items-center pt-4 pb-10 z-50">
        <button onclick="nav('list')" class="nav-item active-nav flex flex-col items-center gap-1">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">Liste</span>
        </button>
        <button onclick="nav('ai')" class="nav-item text-gray-300 flex flex-col items-center gap-1">
            <i data-lucide="bot" class="w-6 h-6"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">KI</span>
        </button>
        <button onclick="nav('config')" class="nav-item text-gray-300 flex flex-col items-center gap-1">
            <i data-lucide="palette" class="w-6 h-6"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">Design</span>
        </button>
    </nav>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center p-6 z-[60] backdrop-blur-md">
        <div class="bg-white rounded-[40px] w-full max-w-md p-8 shadow-2xl animate-slideUp">
            <div id="modal-content" class="text-sm text-slate-600 leading-relaxed max-h-[50vh] overflow-y-auto"></div>
            <button onclick="closeModal()" class="w-full mt-8 py-5 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg">Schließen</button>
        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        let appState = {
            name: localStorage.getItem('sh_name') || 'Smart Einkauf',
            color: localStorage.getItem('sh_color') || '#059669',
            key: localStorage.getItem('sh_key') || '',
            items: JSON.parse(localStorage.getItem('sh_items')) || [
                {id: 1, text: 'Bio-Äpfel', done: false},
                {id: 2, text: 'Hafermilch', done: true}
            ]
        };

        // --- NAVIGATION ---
        function nav(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('sec-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active-nav', 'text-emerald-500');
                n.classList.add('text-gray-300');
            });
            event.currentTarget.classList.add('active-nav');
            event.currentTarget.classList.remove('text-gray-300');
        }

        // --- LIST LOGIC ---
        function render() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            appState.items.sort((a,b) => a.done - b.done).forEach(item => {
                const div = document.createElement('div');
                div.className = `item-row glass p-5 rounded-3xl flex items-center justify-between border border-white card-shadow transition-all ${item.done ? 'opacity-40' : 'bg-white'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-4 flex-1" onclick="toggleItem(${item.id})">
                        <div class="w-6 h-6 rounded-full border-2 border-emerald-500 flex items-center justify-center">
                            ${item.done ? '<div class="w-3 h-3 bg-emerald-500 rounded-full"></div>' : ''}
                        </div>
                        <span class="font-bold text-slate-700 ${item.done ? 'line-through' : ''}">${item.text}</span>
                    </div>
                    <button onclick="deleteItem(${item.id})" class="text-gray-200 hover:text-red-400 p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
            localStorage.setItem('sh_items', JSON.stringify(appState.items));
            updateDot();
        }

        function addItem() {
            const inp = document.getElementById('main-input');
            if(!inp.value) return;
            appState.items.unshift({id: Date.now(), text: inp.value, done: false});
            inp.value = '';
            render();
        }
        function toggleItem(id) { const i = appState.items.find(x => x.id === id); i.done = !i.done; render(); }
        function deleteItem(id) { appState.items = appState.items.filter(x => x.id !== id); render(); }

        // --- AI LOGIC (WITH FALLBACK) ---
        async function fetchAI(prompt) {
            if(!appState.key) return "Bitte gib zuerst deinen API-Key im Design-Tab ein! 🔑";
            
            document.getElementById('ai-typing').classList.remove('hidden');
            
            // Verschiedene API-Schnittstellen probieren (v1 und v1beta)
            const versions = ['v1', 'v1beta'];
            let lastError = "";

            for(let v of versions) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/${v}/models/gemini-1.5-flash:generateContent?key=${appState.key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Du bist ein Einkaufs-Coach. Liste: ${appState.items.map(i=>i.text).join(',')}. Aufgabe: ${prompt}. Antworte kurz und modern.` }] }]
                        })
                    });
                    const data = await response.json();
                    if(response.ok) {
                        document.getElementById('ai-typing').classList.add('hidden');
                        return data.candidates[0].content.parts[0].text;
                    }
                    lastError = data.error.message;
                } catch(e) {
                    lastError = "Netzwerkfehler";
                }
            }

            document.getElementById('ai-typing').classList.add('hidden');
            // DER FALLBACK: Wenn die API blockiert ist, simulieren wir eine intelligente Antwort
            return `[Demo-Modus] Basierend auf deiner Liste (${appState.items.filter(i=>!i.done).map(i=>i.text).join(', ')}) schlage ich vor: Ein gesundes Pfannengericht! 🥗 (Original Fehler: ${lastError})`;
        }

        async function aiMagic(type) {
            openModal('<div class="flex flex-col items-center py-6 gap-4"><div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div><p class="font-bold text-gray-400 uppercase text-[10px] tracking-widest">KI wird aktiviert...</p></div>');
            const prompt = type === 'Rezepte' ? "Gib mir 2 schnelle Rezepte." : "Ist mein Einkauf gesund? Bewerte kurz.";
            const res = await fetchAI(prompt);
            openModal(`<div class="p-2"><h3 class="text-2xl font-black text-emerald-500 mb-4 italic leading-tight">Vorschläge</h3><p class="text-slate-600 font-medium whitespace-pre-line">${res}</p></div>`);
        }

        async function sendChat() {
            const inp = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            if(!inp.value) return;
            const msg = inp.value;
            box.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-500 text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm font-bold">${msg}</div></div>`;
            inp.value = '';
            const res = await fetchAI(msg);
            box.innerHTML += `<div class="flex justify-start"><div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm font-medium text-slate-700">✨ ${res}</div></div>`;
            box.scrollTop = box.scrollHeight;
        }

        // --- SETUP & DESIGN ---
        function saveConfig() {
            appState.name = document.getElementById('cfg-name').value;
            appState.color = document.getElementById('cfg-color').value;
            appState.key = document.getElementById('cfg-key').value;
            
            localStorage.setItem('sh_name', appState.name);
            localStorage.setItem('sh_color', appState.color);
            localStorage.setItem('sh_key', appState.key);
            
            applyConfig();
            alert("Design erfolgreich aktualisiert! 🎨");
            nav('list');
        }

        function applyConfig() {
            document.getElementById('app-name').innerText = appState.name;
            document.documentElement.style.setProperty('--primary', appState.color);
            // Dynamic Button colors
            document.querySelectorAll('.bg-emerald-500').forEach(el => el.style.backgroundColor = appState.color);
            document.querySelectorAll('.text-emerald-500').forEach(el => el.style.color = appState.color);
            updateDot();
        }

        // --- HELPERS ---
        function updateDot() {
            document.getElementById('status-dot').className = appState.key ? 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)]' : 'w-2.5 h-2.5 rounded-full bg-red-400 shadow-[0_0_10px_rgba(248,113,113,0.8)]';
        }
        function openModal(h) { document.getElementById('modal-content').innerHTML = h; document.getElementById('modal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            document.getElementById('cfg-name').value = appState.name;
            document.getElementById('cfg-color').value = appState.color;
            document.getElementById('cfg-key').value = appState.key;
            applyConfig();
        });
    </script>
</body>
</html>
