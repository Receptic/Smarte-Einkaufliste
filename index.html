<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Einkauf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #10b981; }
        body { font-family: sans-serif; background-color: #f8fafc; padding-bottom: 100px; }
        .card { background: white; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #10b981; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="p-8 pb-4 flex justify-between items-center">
        <h1 class="text-3xl font-black text-slate-800">Smart Einkauf</h1>
        <div id="status-dot" class="w-3 h-3 rounded-full bg-rose-400"></div>
    </header>

    <main class="px-5">
        <section id="s-list">
            <div class="flex gap-2 mb-6">
                <input type="text" id="in" placeholder="Was fehlt?" class="flex-1 p-4 rounded-2xl border-none shadow-sm outline-none bg-white text-slate-700">
                <button onclick="add()" class="bg-[#10b981] text-white p-4 rounded-2xl shadow-lg"><i class="fas fa-plus"></i></button>
            </div>
            <div id="list" class="space-y-3"></div>
            <button onclick="ask('Schlage 2 schnelle Rezepte vor')" class="w-full mt-10 bg-white border-2 border-[#10b981] text-[#10b981] font-bold py-4 rounded-2xl flex items-center justify-center gap-3">
                <i class="fas fa-magic"></i> KI-Vorschläge
            </button>
        </section>

        <section id="s-ki" class="hidden">
            <div class="card p-5 min-h-[450px] flex flex-col border border-slate-100">
                <div id="out" class="flex-1 text-sm space-y-4 overflow-y-auto mb-4 p-1 text-slate-500 italic">✨ Frag mich was!</div>
                <div id="loading" class="hidden flex items-center gap-2 text-emerald-500 text-xs mb-4"><div class="loader"></div> KI denkt nach...</div>
                <div class="flex gap-2 bg-slate-100 p-2 rounded-2xl">
                    <input type="text" id="chat-in" placeholder="Frage stellen..." class="flex-1 bg-transparent p-2 outline-none">
                    <button onclick="send()" class="bg-[#10b981] text-white w-12 h-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <section id="s-set" class="hidden">
            <div class="card p-8">
                <h2 class="font-bold text-xl mb-4 text-slate-800">Setup</h2>
                <input type="password" id="key-in" placeholder="AIza..." class="w-full p-4 bg-slate-50 rounded-xl border-none mb-4 outline-none text-sm">
                <button onclick="save()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-xl">Speichern</button>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-100 flex justify-around p-5">
        <button onclick="nav('list')" class="n-btn active text-emerald-500 flex flex-col items-center gap-1"><i class="fas fa-list text-xl"></i><span class="text-[9px] font-bold">LISTE</span></button>
        <button onclick="nav('ki')" class="n-btn text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-robot text-xl"></i><span class="text-[9px] font-bold">KI</span></button>
        <button onclick="nav('set')" class="n-btn text-slate-300 flex flex-col items-center gap-1"><i class="fas fa-key text-xl"></i><span class="text-[9px] font-bold">SETUP</span></button>
    </nav>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-6 z-50 backdrop-blur-md">
        <div class="bg-white rounded-[32px] w-full max-w-md p-8 shadow-2xl overflow-y-auto max-h-[75vh]">
            <div id="m-content" class="text-sm leading-relaxed text-slate-600"></div>
            <button onclick="closeM()" class="w-full mt-8 py-4 bg-[#10b981] text-white rounded-2xl font-bold">Schließen</button>
        </div>
    </div>

    <script>
        let s = {
            i: JSON.parse(localStorage.getItem('i')) || [{id:1, name:'Brot', c:false}],
            k: localStorage.getItem('k') || ''
        };

        function nav(id) {
            document.querySelectorAll('section').forEach(x => x.classList.add('hidden'));
            document.getElementById('s-' + id).classList.remove('hidden');
            document.querySelectorAll('.n-btn').forEach(b => { b.classList.remove('text-emerald-500'); b.classList.add('text-slate-300'); });
            event.currentTarget.classList.add('text-emerald-500');
        }

        function render() {
            const l = document.getElementById('list');
            l.innerHTML = '';
            s.i.forEach(x => {
                const d = document.createElement('div');
                d.className = `card p-5 flex items-center justify-between ${x.c ? 'opacity-30' : ''}`;
                d.innerHTML = `<div class="flex items-center gap-4" onclick="toggle(${x.id})"><div class="w-6 h-6 rounded-full border-2 border-[#10b981] flex items-center justify-center">${x.c ? '✓' : ''}</div><span class="${x.c ? 'line-through' : 'font-bold'}">${x.name}</span></div><button onclick="del(${x.id})" class="text-slate-200"><i class="fas fa-trash"></i></button>`;
                l.appendChild(d);
            });
            localStorage.setItem('i', JSON.stringify(s.i));
            document.getElementById('status-dot').className = s.k ? 'w-3 h-3 rounded-full bg-emerald-400 shadow-lg' : 'w-3 h-3 rounded-full bg-rose-400';
        }

        function add() {
            const v = document.getElementById('in').value;
            if(!v) return;
            s.i.unshift({id: Date.now(), name: v, c: false});
            document.getElementById('in').value = '';
            render();
        }

        function toggle(id) { const x = s.i.find(a => a.id === id); x.c = !x.c; render(); }
        function del(id) { s.i = s.i.filter(a => a.id !== id); render(); }
        function save() { s.k = document.getElementById('key-in').value.trim(); localStorage.setItem('k', s.k); render(); alert("Key gespeichert!"); }

        // DER UNIVERSAL-CONNECTOR
        async function go(p) {
            if(!s.k) return {e: "Bitte Key im Setup eingeben!"};
            
            // Wir testen nacheinander verschiedene Kombinationen, die Google akzeptiert
            const configs = [
                { v: 'v1beta', m: 'gemini-1.5-flash' },
                { v: 'v1', m: 'gemini-1.5-flash' },
                { v: 'v1beta', m: 'gemini-pro' }
            ];

            for (let conf of configs) {
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/${conf.v}/models/${conf.m}:generateContent?key=${s.k}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{parts: [{text: `Liste: ${s.i.map(x=>x.name).join(',')}. Aufgabe: ${p}`}]}]})
                    });
                    const d = await r.json();
                    if(r.ok && d.candidates) return {t: d.candidates[0].content.parts[0].text};
                } catch (e) { console.log("Versuch fehlgeschlagen, probiere nächsten..."); }
            }
            return {e: "Die KI ist blockiert. Bitte prüfe im Google Cloud Setup: Ist der Key auf 'KEINE EINSCHRÄNKUNGEN' gestellt?"};
        }

        async function send() {
            const i = document.getElementById('chat-in');
            const o = document.getElementById('out');
            if(!i.value) return;
            const m = i.value;
            o.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-500 text-white p-4 rounded-3xl rounded-tr-none max-w-[85%]">${m}</div></div>`;
            i.value = '';
            document.getElementById('loading').classList.remove('hidden');
            const res = await go(m);
            document.getElementById('loading').classList.add('hidden');
            o.innerHTML += `<div class="flex justify-start"><div class="bg-white border p-4 rounded-3xl rounded-tl-none max-w-[85%] shadow-sm text-slate-700 font-medium">✨ ${res.e ? res.e : res.t}</div></div>`;
            o.scrollTop = o.scrollHeight;
        }

        async function ask(p) {
            openM('<div class="flex flex-col items-center p-6"><div class="loader mb-4"></div> KI plant...</div>');
            const res = await go(p);
            openM(`<h3 class="font-black text-2xl mb-5 text-emerald-500 italic">KI-Vorschlag</h3><div class="whitespace-pre-line text-slate-600">${res.e ? res.e : res.t}</div>`);
        }

        function openM(h) { document.getElementById('m-content').innerHTML = h; document.getElementById('modal').classList.replace('hidden', 'flex'); }
        function closeM() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        document.addEventListener('DOMContentLoaded', () => { render(); if(s.k) document.getElementById('key-in').value = s.k; });
    </script>
</body>
</html>
