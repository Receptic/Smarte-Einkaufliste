<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Einkauf AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .hidden { display: none !important; }
        .tab-active { color: var(--p); border-top: 3px solid var(--p); }
        .item-row { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full z-40 glass border-b border-gray-100 px-6 pt-12 pb-4 flex justify-between items-end">
        <div>
            <h1 id="ui-app-name" class="text-2xl font-extrabold text-slate-900 tracking-tight">Smart Einkauf</h1>
            <p id="ui-status" class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">AI Power 2026</p>
        </div>
        <div id="dot" class="w-3 h-3 rounded-full bg-rose-500 shadow-lg transition-colors"></div>
    </header>

    <main class="pt-32 px-5 max-w-lg mx-auto">
        
        <!-- SEITE 1: LISTE -->
        <section id="p-list" class="space-y-4">
            <div class="bg-white p-2 rounded-[28px] shadow-sm border border-gray-100 flex gap-2">
                <input type="text" id="in-q" placeholder="Menge" class="w-20 p-4 bg-gray-50 rounded-2xl outline-none text-sm font-bold text-emerald-600">
                <input type="text" id="in-n" placeholder="Was fehlt?" class="flex-1 p-4 bg-transparent outline-none text-sm font-medium">
                <button onclick="add('list')" class="bg-emerald-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all"><i data-lucide="plus"></i></button>
            </div>
            <div id="cont-list" class="space-y-2"></div>
        </section>

        <!-- SEITE 2: VORRAT -->
        <section id="p-fridge" class="hidden space-y-4">
            <div class="bg-slate-900 text-white p-6 rounded-[32px] shadow-xl relative overflow-hidden">
                <h2 class="text-lg font-bold mb-1">Mein Kühlschrank</h2>
                <div class="mt-4 flex gap-2">
                    <label class="flex-1 bg-white/10 p-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-white/20">
                        <i data-lucide="camera" class="w-4 h-4"></i> <span class="text-xs font-bold">Foto scannen</span>
                        <input type="file" accept="image/*" class="hidden" onchange="scan(this)">
                    </label>
                </div>
            </div>
            <div class="bg-white p-2 rounded-[28px] shadow-sm border border-gray-100 flex gap-2">
                <input type="text" id="in-fq" placeholder="Anzahl" class="w-20 p-4 bg-gray-50 rounded-2xl outline-none text-sm font-bold text-slate-500">
                <input type="text" id="in-fn" placeholder="Was ist noch da?" class="flex-1 p-4 bg-transparent outline-none text-sm font-medium">
                <button onclick="add('fridge')" class="bg-slate-800 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all"><i data-lucide="plus"></i></button>
            </div>
            <div id="cont-fridge" class="space-y-2 opacity-80"></div>
        </section>

        <!-- SEITE 3: KI CHEF -->
        <section id="p-ai" class="hidden space-y-4 text-center">
            <button id="ai-btn" onclick="askChef()" class="w-full bg-emerald-500 text-white font-extrabold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-all">
                <i data-lucide="sparkles"></i> Was kann ich kochen?
            </button>
            <div id="ai-out" class="mt-6 text-sm text-slate-600 text-left leading-relaxed min-h-[100px] bg-white p-6 rounded-[32px] shadow-sm border border-gray-100">
                Klicke auf den Button oben! ✨
            </div>
        </section>

        <!-- SEITE 4: SETUP -->
        <section id="p-set" class="hidden">
            <div class="bg-white rounded-[32px] p-8 shadow-sm space-y-6">
                <h2 class="font-bold text-lg">Konfiguration</h2>
                <input type="password" id="cfg-k" placeholder="AIza..." class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none text-xs">
                <button onclick="save()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Speichern</button>
                <p id="debug" class="text-[9px] text-rose-500 font-mono break-all"></p>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 w-full glass border-t border-gray-100 flex justify-around items-center pt-3 pb-8 z-50">
        <button onclick="nav('list')" class="n-btn tab-active px-6 flex flex-col items-center gap-1"><i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Liste</span></button>
        <button onclick="nav('fridge')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="refrigerator" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Vorrat</span></button>
        <button onclick="nav('ai')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="chef-hat" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">KI Chef</span></button>
        <button onclick="nav('set')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="settings" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Setup</span></button>
    </nav>

    <script>
        let state = {
            k: localStorage.getItem('k_2026') || '',
            list: JSON.parse(localStorage.getItem('l_2026')) || [{n:'Nudeln', q:'500g'}],
            fridge: JSON.parse(localStorage.getItem('f_2026')) || [{n:'Eier', q:'4'}]
        };

        function nav(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('p-' + id).classList.remove('hidden');
            document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('tab-active', 'text-emerald-500'));
            event.currentTarget.classList.add('tab-active', 'text-emerald-500');
        }

        function render() {
            const renderSec = (t, cId) => {
                const c = document.getElementById(cId);
                c.innerHTML = '';
                state[t].forEach((item, i) => {
                    const d = document.createElement('div');
                    d.className = "item-row bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-50";
                    d.innerHTML = `<div><span class="text-emerald-600 text-xs font-bold mr-2">${item.q}</span><span class="font-bold text-slate-700">${item.n}</span></div>
                                   <button onclick="del('${t}', ${i})" class="text-slate-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                    c.appendChild(d);
                });
            };
            renderSec('list', 'cont-list');
            renderSec('fridge', 'cont-fridge');
            localStorage.setItem('l_2026', JSON.stringify(state.list));
            localStorage.setItem('f_2026', JSON.stringify(state.fridge));
            document.getElementById('dot').className = state.k ? 'w-3 h-3 rounded-full bg-emerald-400 shadow-lg' : 'w-3 h-3 rounded-full bg-rose-400 shadow-lg';
            lucide.createIcons();
        }

        function add(t) {
            const n = document.getElementById(t === 'list' ? 'in-n' : 'in-fn').value;
            const q = document.getElementById(t === 'list' ? 'in-q' : 'in-fq').value || '1';
            if(!n) return;
            state[t].unshift({n, q});
            document.getElementById(t === 'list' ? 'in-n' : 'in-fn').value = '';
            document.getElementById(t === 'list' ? 'in-q' : 'in-fq').value = '';
            render();
        }

        function del(t, i) { state[t].splice(i, 1); render(); }
        function save() { state.k = document.getElementById('cfg-k').value.trim(); localStorage.setItem('k_2026', state.k); render(); alert("Gespeichert!"); }

        // DER FIX: Probiert v1 UND v1beta automatisch aus
        async function callAI(p, img = null) {
            if(!state.k) return "Fehler: Kein API-Key.";
            const endpoints = [
                { v: 'v1beta', m: 'gemini-1.5-flash' },
                { v: 'v1', m: 'gemini-1.5-flash' }
            ];
            let lastErr = "";
            for (let conf of endpoints) {
                try {
                    const url = `https://generativelanguage.googleapis.com/${conf.v}/models/${conf.m}:generateContent?key=${state.k}`;
                    let parts = [{ text: p }];
                    if(img) parts.push({ inline_data: { mime_type: "image/jpeg", data: img } });
                    const r = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({contents: [{parts}]}) });
                    const d = await r.json();
                    if(r.ok) return d.candidates[0].content.parts[0].text;
                    lastErr = d.error.message;
                } catch(e) { lastErr = "Netzwerkfehler"; }
            }
            return "KI-Fehler: " + lastErr;
        }

        async function askChef() {
            const out = document.getElementById('ai-out');
            out.innerHTML = "Chef Gemini überlegt...";
            const prompt = `Kühlschrank: ${state.fridge.map(i=>i.q+' '+i.n).join(',')}. Liste: ${state.list.map(i=>i.q+' '+i.n).join(',')}. Schlage 2 Rezepte vor. Antworte kurz mit Emojis.`;
            const res = await callAI(prompt);
            out.innerHTML = res.replace(/\n/g, '<br>');
        }

        async function scan(input) {
            const file = input.files[0]; if(!file) return;
            document.getElementById('ui-status').innerText = "Scanne...";
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const res = await callAI("Was ist im Kühlschrank? Antworte NUR als Liste mit Komma getrennt (z.B. 2 Äpfel, 1 Milch).", base64);
                res.split(',').forEach(item => {
                    const p = item.trim().split(' ');
                    const q = p.length > 1 ? p.shift() : '1';
                    state.fridge.unshift({n: p.join(' '), q});
                });
                document.getElementById('ui-status').innerText = "Fertig!"; render();
            };
            reader.readAsDataURL(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            if(state.k) document.getElementById('cfg-k').value = state.k;
        });
    </script>
</body>
</html>
