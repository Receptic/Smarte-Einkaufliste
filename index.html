<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Einkauf AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 100px; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .hidden { display: none !important; }
        .tab-active { color: var(--p); border-top: 3px solid var(--p); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-40 glass border-b border-gray-100 px-6 pt-12 pb-4 flex justify-between items-end">
        <div>
            <h1 id="app-name" class="text-2xl font-extrabold text-slate-900">Smart Einkauf</h1>
            <p id="app-status" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Workshop Edition</p>
        </div>
        <div id="api-indicator" class="w-3 h-3 rounded-full bg-red-400 shadow-lg"></div>
    </header>

    <main class="pt-32 px-5 max-w-lg mx-auto">
        
        <!-- SEITE 1: EINKAUFSLISTE -->
        <section id="page-list" class="space-y-4">
            <div class="relative">
                <input type="text" id="inp-list" placeholder="Was fehlt?" class="w-full p-5 bg-white rounded-3xl shadow-sm outline-none border border-gray-50">
                <button onclick="addItem('list')" class="absolute right-2 top-2 bg-emerald-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="plus"></i></button>
            </div>
            <div id="container-list" class="space-y-2"></div>
        </section>

        <!-- SEITE 2: KÜHLSCHRANK (INVENTAR) -->
        <section id="page-fridge" class="hidden space-y-4">
            <div class="bg-emerald-900 text-white p-6 rounded-[32px] shadow-xl relative overflow-hidden">
                <h2 class="text-xl font-bold mb-1 italic">Mein Kühlschrank</h2>
                <p class="text-emerald-200 text-xs">Das habe ich noch zu Hause</p>
                <div class="mt-4 flex gap-2">
                    <label class="flex-1 bg-white/20 p-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-white/30 transition-all">
                        <i data-lucide="camera" class="w-5 h-5"></i> <span class="text-xs font-bold">Foto scannen</span>
                        <input type="file" accept="image/*" class="hidden" onchange="scanFridge(this)">
                    </label>
                </div>
            </div>
            <div class="relative">
                <input type="text" id="inp-fridge" placeholder="Manuell hinzufügen..." class="w-full p-5 bg-white rounded-3xl shadow-sm outline-none border border-gray-50 text-sm">
                <button onclick="addItem('fridge')" class="absolute right-2 top-2 bg-slate-800 text-white w-12 h-12 rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
            </div>
            <div id="container-fridge" class="space-y-2 opacity-80"></div>
        </section>

        <!-- SEITE 3: KI CHEF -->
        <section id="page-ai" class="hidden space-y-4">
            <button onclick="getRecipes()" class="w-full bg-white border-2 border-emerald-500 text-emerald-600 font-extrabold py-6 rounded-[32px] shadow-sm flex items-center justify-center gap-3 active:scale-95 transition-all">
                <i data-lucide="utensils-crossre"></i> Was kann ich kochen?
            </button>
            <div id="ai-result" class="bg-white rounded-[32px] p-6 shadow-sm border border-gray-50 min-h-[200px] text-sm text-slate-600 leading-relaxed">
                Klicke oben, um deine Einkaufsliste und deinen Kühlschrank analysieren zu lassen... ✨
            </div>
        </section>

        <!-- SEITE 4: SETUP -->
        <section id="page-setup" class="hidden">
            <div class="bg-white rounded-[32px] p-8 shadow-sm space-y-6">
                <h2 class="font-bold">Einstellungen</h2>
                <input type="text" id="cfg-key" placeholder="Gemini API Key (AIza...)" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none text-xs">
                <button onclick="saveKey()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Key Speichern</button>
                <div class="p-4 bg-blue-50 rounded-2xl text-[10px] text-blue-500">
                    Den Key erhältst du kostenlos auf <b>aistudio.google.com</b>. Ohne Key funktioniert die KI-Analyse nicht.
                </div>
            </div>
        </section>
    </main>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 w-full glass border-t border-gray-100 flex justify-around items-center pt-3 pb-8 z-50">
        <button onclick="nav('list')" class="nav-btn tab-active px-4 flex flex-col items-center gap-1"><i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Liste</span></button>
        <button onclick="nav('fridge')" class="nav-btn px-4 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="container" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Vorrat</span></button>
        <button onclick="nav('ai')" class="nav-btn px-4 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="chef-hat" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">KI Chef</span></button>
        <button onclick="nav('setup')" class="nav-btn px-4 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="settings" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Setup</span></button>
    </nav>

    <script>
        let state = {
            key: localStorage.getItem('sh_key') || '',
            list: JSON.parse(localStorage.getItem('sh_list')) || ['Nudeln', 'Tomaten'],
            fridge: JSON.parse(localStorage.getItem('sh_fridge')) || ['Zwiebeln', 'Öl']
        };

        function nav(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('tab-active', 'text-emerald-500'));
            event.currentTarget.classList.add('tab-active', 'text-emerald-500');
        }

        function render() {
            renderSection('list');
            renderSection('fridge');
            document.getElementById('api-indicator').className = state.key ? 'w-3 h-3 rounded-full bg-emerald-400' : 'w-3 h-3 rounded-full bg-red-400';
            lucide.createIcons();
        }

        function renderSection(type) {
            const cont = document.getElementById('container-' + type);
            cont.innerHTML = '';
            state[type].forEach((item, idx) => {
                const d = document.createElement('div');
                d.className = "bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-50 animate-slide-up";
                d.innerHTML = `<span class="font-bold text-slate-700">${item}</span>
                               <button onclick="removeItem('${type}', ${idx})" class="text-gray-300"><i data-lucide="x" class="w-4 h-4"></i></button>`;
                cont.appendChild(d);
            });
            localStorage.setItem('sh_' + type, JSON.stringify(state[type]));
        }

        function addItem(type) {
            const inp = document.getElementById('inp-' + type);
            if(!inp.value) return;
            state[type].unshift(inp.value);
            inp.value = '';
            render();
        }

        function removeItem(type, idx) {
            state[type].splice(idx, 1);
            render();
        }

        function saveKey() {
            state.key = document.getElementById('cfg-key').value.trim();
            localStorage.setItem('sh_key', state.key);
            render();
            alert("Key gespeichert!");
        }

        // KI FUNKTION: REZEPTE
        async function getRecipes() {
            if(!state.key) return alert("Kein Key hinterlegt!");
            const out = document.getElementById('ai-result');
            out.innerHTML = "Chef Gemini denkt nach... 👨‍🍳";
            
            const prompt = `Ich habe im Kühlschrank: ${state.fridge.join(', ')}. 
                            Ich möchte einkaufen: ${state.list.join(', ')}. 
                            Schlage mir 2 Rezepte vor, die möglichst viel davon nutzen. 
                            Antworte kurz mit Emojis.`;

            const res = await fetchAI(prompt);
            out.innerHTML = res.replace(/\n/g, '<br>');
        }

        // KI FUNKTION: KÜHLSCHRANK SCAN
        async function scanFridge(input) {
            if(!state.key) return alert("Bitte erst Key im Setup eingeben!");
            const file = input.files[0];
            if(!file) return;
            
            document.getElementById('app-status').innerText = "Scanne Foto...";
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const prompt = "Was siehst du in diesem Kühlschrank? Liste nur die Lebensmittel mit Komma getrennt auf, nichts anderes.";
                const res = await fetchAI(prompt, base64);
                
                const items = res.split(',');
                items.forEach(i => state.fridge.unshift(i.trim()));
                document.getElementById('app-status').innerText = "Scan fertig!";
                render();
            };
            reader.readAsDataURL(file);
        }

        async function fetchAI(prompt, imageBase64 = null) {
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${state.key}`;
            
            let body = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            if(imageBase64) {
                body.contents[0].parts.push({
                    inline_data: { mime_type: "image/jpeg", data: imageBase64 }
                });
            }

            try {
                const response = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch(e) { return "Fehler bei der KI-Anfrage."; }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
