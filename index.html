<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Einkauf Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .hidden { display: none !important; }
        .tab-active { color: var(--p); border-top: 3px solid var(--p); }
        input::placeholder { color: #94a3b8; font-size: 0.9rem; }
        .item-row { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="fixed top-0 w-full z-40 glass border-b border-gray-100 px-6 pt-12 pb-4 flex justify-between items-end">
        <div>
            <h1 id="ui-app-name" class="text-2xl font-extrabold text-slate-900 tracking-tight">Smart Einkauf</h1>
            <p id="ui-status" class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">AI Power 2026</p>
        </div>
        <div id="dot" class="w-3 h-3 rounded-full bg-rose-500 shadow-lg transition-colors"></div>
    </header>

    <main class="pt-32 px-5 max-w-lg mx-auto">
        
        <!-- SEITE 1: EINKAUFSLISTE -->
        <section id="p-list" class="space-y-4">
            <div class="bg-white p-2 rounded-[28px] shadow-sm border border-gray-100 flex gap-2">
                <input type="text" id="in-q" placeholder="Menge" class="w-20 p-4 bg-gray-50 rounded-2xl outline-none text-sm font-bold text-emerald-600">
                <input type="text" id="in-n" placeholder="Was fehlt?" class="flex-1 p-4 bg-transparent outline-none text-sm font-medium">
                <button onclick="add('list')" class="bg-emerald-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all"><i data-lucide="plus"></i></button>
            </div>
            <div id="cont-list" class="space-y-2"></div>
        </section>

        <!-- SEITE 2: VORRAT (KÜHLSCHRANK) -->
        <section id="p-fridge" class="hidden space-y-4">
            <div class="bg-slate-900 text-white p-6 rounded-[32px] shadow-xl relative overflow-hidden">
                <h2 class="text-lg font-bold mb-1">Mein Kühlschrank</h2>
                <p class="text-slate-400 text-[10px] uppercase tracking-widest font-bold">Aktueller Vorrat</p>
                <div class="mt-4 flex gap-2">
                    <label class="flex-1 bg-white/10 p-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer hover:bg-white/20">
                        <i data-lucide="camera" class="w-4 h-4"></i> <span class="text-xs font-bold">Foto scannen</span>
                        <input type="file" accept="image/*" class="hidden" onchange="scan(this)">
                    </label>
                </div>
            </div>
            <div class="bg-white p-2 rounded-[28px] shadow-sm border border-gray-100 flex gap-2">
                <input type="text" id="in-fq" placeholder="Anzahl" class="w-20 p-4 bg-gray-50 rounded-2xl outline-none text-sm font-bold text-slate-500">
                <input type="text" id="in-fn" placeholder="Was ist noch da?" class="flex-1 p-4 bg-transparent outline-none text-sm font-medium">
                <button onclick="add('fridge')" class="bg-slate-800 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all"><i data-lucide="plus"></i></button>
            </div>
            <div id="cont-fridge" class="space-y-2 opacity-80"></div>
        </section>

        <!-- SEITE 3: KI CHEF -->
        <section id="p-ai" class="hidden space-y-4">
            <div class="bg-white rounded-[32px] p-6 shadow-sm border border-gray-100">
                <button id="ai-btn" onclick="askChef()" class="w-full bg-emerald-500 text-white font-extrabold py-5 rounded-2xl shadow-lg shadow-emerald-100 flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <i data-lucide="sparkles"></i> Was kann ich kochen?
                </button>
                <div id="ai-out" class="mt-6 text-sm text-slate-600 leading-relaxed min-h-[100px]">
                    Klicke auf den Button, um Rezepte basierend auf deinem Vorrat und Einkauf zu erhalten.
                </div>
            </div>
        </section>

        <!-- SEITE 4: SETUP -->
        <section id="p-set" class="hidden">
            <div class="bg-white rounded-[32px] p-8 shadow-sm space-y-6">
                <h2 class="font-bold text-lg">Konfiguration</h2>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Gemini API Key</label>
                    <input type="password" id="cfg-k" placeholder="AIza..." class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none mt-1 text-xs">
                </div>
                <button onclick="save()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold active:scale-95">Einstellungen speichern</button>
                <p id="debug" class="text-[9px] text-rose-500 font-mono break-all"></p>
            </div>
        </section>

    </main>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 w-full glass border-t border-gray-100 flex justify-around items-center pt-3 pb-8 z-50">
        <button onclick="nav('list')" class="n-btn tab-active px-6 flex flex-col items-center gap-1"><i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Liste</span></button>
        <button onclick="nav('fridge')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="refrigerator" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Vorrat</span></button>
        <button onclick="nav('ai')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="chef-hat" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">KI Chef</span></button>
        <button onclick="nav('set')" class="n-btn px-6 flex flex-col items-center gap-1 text-gray-400"><i data-lucide="settings" class="w-5 h-5"></i><span class="text-[8px] font-bold uppercase">Setup</span></button>
    </nav>

    <script>
        let state = {
            k: localStorage.getItem('k_2026') || '',
            list: JSON.parse(localStorage.getItem('l_2026')) || [{n:'Tomaten', q:'2 Stk'}, {n:'Nudeln', q:'500g'}],
            fridge: JSON.parse(localStorage.getItem('f_2026')) || [{n:'Zwiebeln', q:'1'}, {n:'Olivenöl', q:'Rest'}]
        };

        function nav(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('p-' + id).classList.remove('hidden');
            document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('tab-active', 'text-emerald-500'));
            event.currentTarget.classList.add('tab-active', 'text-emerald-500');
        }

        function render() {
            renderSec('list');
            renderSectionFridge('fridge');
            document.getElementById('dot').className = state.k ? 'w-3 h-3 rounded-full bg-emerald-400' : 'w-3 h-3 rounded-full bg-rose-400';
            lucide.createIcons();
        }

        function renderSec(t) {
            const c = document.getElementById('cont-' + t);
            c.innerHTML = '';
            state[t].forEach((item, i) => {
                const d = document.createElement('div');
                d.className = "item-row bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-50";
                d.innerHTML = `<div class="flex items-center gap-3">
                                <span class="bg-emerald-50 text-emerald-600 text-[10px] font-black px-2 py-1 rounded-lg">${item.q || '1'}</span>
                                <span class="font-bold text-slate-700">${item.n}</span>
                               </div>
                               <button onclick="del('${t}', ${i})" class="text-slate-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                c.appendChild(d);
            });
            localStorage.setItem('l_2026', JSON.stringify(state.list));
        }

        function renderSectionFridge(t) {
            const c = document.getElementById('cont-fridge');
            c.innerHTML = '';
            state.fridge.forEach((item, i) => {
                const d = document.createElement('div');
                d.className = "item-row bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm opacity-80";
                d.innerHTML = `<div><span class="text-slate-400 text-xs mr-2 font-bold">${item.q}</span><span class="font-medium text-slate-600">${item.n}</span></div>
                               <button onclick="del('fridge', ${i})" class="text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>`;
                c.appendChild(d);
            });
            localStorage.setItem('f_2026', JSON.stringify(state.fridge));
        }

        function add(t) {
            const n = document.getElementById(t === 'list' ? 'in-n' : 'in-fn').value;
            const q = document.getElementById(t === 'list' ? 'in-q' : 'in-fq').value || '1';
            if(!n) return;
            state[t].unshift({n, q});
            document.getElementById(t === 'list' ? 'in-n' : 'in-fn').value = '';
            document.getElementById(t === 'list' ? 'in-q' : 'in-fq').value = '';
            render();
        }

        function del(t, i) { state[t].splice(i, 1); render(); }
        function save() { state.k = document.getElementById('cfg-k').value.trim(); localStorage.setItem('k_2026', state.k); render(); alert("Gespeichert!"); }

        async function askChef() {
            if(!state.k) return alert("Bitte erst den API-Key im Setup eingeben!");
            const out = document.getElementById('ai-out');
            out.innerHTML = '<div class="flex items-center gap-3 font-bold text-emerald-500"><div class="w-4 h-4 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div> Chef Gemini erstellt Rezepte...</div>';
            
            const prompt = `Du bist ein Profi-Koch. 
            Vorrat zu Hause: ${state.fridge.map(i=>i.q + ' ' + i.n).join(', ')}. 
            Einkaufsliste: ${state.list.map(i=>i.q + ' ' + i.n).join(', ')}.
            Schlage 2 leckere Gerichte vor. Antworte kurz, mit Emojis und Mengenangaben.`;

            const res = await callAI(prompt);
            out.innerHTML = `<div class="animate-slide-up bg-emerald-50 p-4 rounded-2xl border border-emerald-100">${res.replace(/\n/g, '<br>')}</div>`;
        }

        async function scan(input) {
            if(!state.k) return alert("Bitte erst Key im Setup eingeben!");
            const file = input.files[0];
            if(!file) return;
            document.getElementById('ui-status').innerText = "KI scannt Foto...";
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const prompt = "Analysiere dieses Foto eines Kühlschranks oder von Lebensmitteln. Liste alle Lebensmittel auf, die du siehst, inklusive geschätzter Menge (z.B. '3 Äpfel', 'halbe Packung Milch'). Antworte NUR als Liste mit Komma getrennt.";
                const res = await callAI(prompt, base64);
                
                const items = res.split(',');
                items.forEach(item => {
                    const parts = item.trim().split(' ');
                    const q = parts.length > 1 ? parts.shift() : '1';
                    const n = parts.join(' ');
                    if(n) state.fridge.unshift({n, q});
                });
                document.getElementById('ui-status').innerText = "Scan abgeschlossen!";
                render();
            };
            reader.readAsDataURL(file);
        }

        async function callAI(p, img = null) {
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${state.k}`;
            let parts = [{ text: p }];
            if(img) parts.push({ inline_data: { mime_type: "image/jpeg", data: img } });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts }] })
                });
                const data = await response.json();
                if(data.error) {
                    document.getElementById('debug').innerText = "Google Error: " + data.error.message;
                    return "Fehler: " + data.error.message;
                }
                return data.candidates[0].content.parts[0].text;
            } catch(e) { 
                return "Netzwerkfehler. Bitte Internet prüfen."; 
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            if(state.k) document.getElementById('cfg-k').value = state.k;
        });
    </script>
</body>
</html>
