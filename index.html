<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Einkauf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #22c55e; }
        .bg-primary { background-color: var(--primary-color); }
        body { font-family: sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .hidden-section { display: none; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--primary-color); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="p-6">
        <h1 class="text-3xl font-black text-gray-800 tracking-tight">Smart Einkauf</h1>
        <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">KI Workshop Edition</p>
    </header>

    <main class="px-4">
        <!-- LISTE -->
        <section id="section-einkauf">
            <div class="flex gap-2 mb-6">
                <input type="text" id="item-input" placeholder="Was brauchst du?" class="flex-1 p-4 rounded-2xl border-none shadow-inner bg-gray-100 outline-none">
                <button onclick="addItem()" class="bg-primary text-white p-4 rounded-2xl shadow-lg active:scale-90 transition-transform"><i class="fas fa-plus"></i></button>
            </div>
            <div id="shopping-list" class="space-y-3"></div>
            
            <div class="mt-8 space-y-3">
                <button onclick="askGemini('Schlage 2 Rezepte vor')" class="w-full bg-white border-2 border-primary text-primary font-bold py-4 rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center gap-3">
                    <i class="fas fa-magic"></i> KI-Rezept-Ideen
                </button>
            </div>
        </section>

        <!-- KI CHAT -->
        <section id="section-ki" class="hidden-section">
            <div class="card p-4 min-h-[450px] flex flex-col bg-white border border-gray-100">
                <div id="chat-output" class="flex-1 text-sm space-y-4 overflow-y-auto mb-4 p-2">
                    <div class="bg-gray-50 p-4 rounded-2xl text-gray-500 rounded-tl-none">✨ Hallo! Ich bin dein KI-Assistent. Frag mich nach Rezepten oder gesunden Alternativen!</div>
                </div>
                <div id="ai-loading" class="hidden flex items-center gap-2 text-primary text-xs mb-4 px-2">
                    <div class="loader"></div> Gemini denkt nach...
                </div>
                <div class="flex gap-2 bg-gray-100 p-2 rounded-2xl">
                    <input type="text" id="chat-input" placeholder="Frage stellen..." class="flex-1 bg-transparent p-2 outline-none">
                    <button onclick="sendChat()" class="bg-primary text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- SETUP -->
        <section id="section-settings" class="hidden-section">
            <div class="card p-6">
                <h2 class="font-bold text-xl mb-2 text-gray-800">Setup</h2>
                <p class="text-xs text-gray-400 mb-6">Gib deinen API-Key ein oder nutze <span class="font-bold text-gray-600">DEMO</span> zum Testen.</p>
                
                <label class="text-xs font-bold text-gray-500 mb-2 block uppercase">Gemini API Key</label>
                <input type="text" id="api-key-input" placeholder="AIza... oder DEMO" class="w-full p-4 bg-gray-50 rounded-xl border-2 border-gray-100 mb-4 outline-none focus:border-primary transition-colors text-sm">
                
                <button onclick="saveApiKey()" class="w-full bg-gray-800 text-white py-4 rounded-xl font-bold shadow-xl active:scale-95 transition-transform">Einstellungen speichern</button>
                <p id="save-status" class="hidden text-center text-green-500 text-xs mt-4 font-bold animate-bounce">✅ Gespeichert!</p>
            </div>
        </section>
    </main>

    <!-- NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-gray-100 flex justify-around p-4">
        <button onclick="showSection('einkauf')" class="nav-btn active text-primary flex flex-col items-center gap-1"><i class="fas fa-shopping-bag text-xl"></i><span class="text-[10px] font-bold uppercase">Liste</span></button>
        <button onclick="showSection('ki')" class="nav-btn text-gray-300 flex flex-col items-center gap-1"><i class="fas fa-comment-dots text-xl"></i><span class="text-[10px] font-bold uppercase">KI Chat</span></button>
        <button onclick="showSection('settings')" class="nav-btn text-gray-300 flex flex-col items-center gap-1"><i class="fas fa-sliders-h text-xl"></i><span class="text-[10px] font-bold uppercase">Setup</span></button>
    </nav>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-6 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl overflow-y-auto max-h-[70vh]">
            <div id="modal-content" class="text-sm leading-relaxed text-gray-700"></div>
            <button onclick="closeModal()" class="w-full mt-8 py-4 bg-primary text-white rounded-2xl font-bold shadow-lg">Schließen</button>
        </div>
    </div>

    <script>
        let state = {
            items: JSON.parse(localStorage.getItem('items')) || [{id:1, name:'Äpfel', checked:false}, {id:2, name:'Brot', checked:false}],
            apiKey: localStorage.getItem('gemini_key') || ''
        };

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById('section-' + id).classList.remove('hidden-section');
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-primary'); b.classList.add('text-gray-300'); });
            event.currentTarget.classList.add('text-primary');
            event.currentTarget.classList.remove('text-gray-300');
        }

        function renderItems() {
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            state.items.forEach(item => {
                const div = document.createElement('div');
                div.className = `card p-5 flex items-center justify-between transition-all ${item.checked ? 'opacity-40 scale-95' : ''}`;
                div.innerHTML = `<div class="flex items-center gap-4" onclick="toggleItem(${item.id})">
                    <div class="w-6 h-6 rounded-lg border-2 border-primary flex items-center justify-center">
                        ${item.checked ? '<i class="fas fa-check text-primary text-xs"></i>' : ''}
                    </div>
                    <span class="${item.checked ? 'line-through text-gray-400' : 'font-bold text-gray-700'}">${item.name}</span>
                </div>
                <button onclick="deleteItem(${item.id})" class="text-gray-300 hover:text-red-500 transition-colors"><i class="fas fa-times"></i></button>`;
                list.appendChild(div);
            });
            localStorage.setItem('items', JSON.stringify(state.items));
        }

        function addItem() {
            const input = document.getElementById('item-input');
            if(!input.value) return;
            state.items.unshift({id: Date.now(), name: input.value, checked: false});
            input.value = '';
            renderItems();
        }

        function toggleItem(id) {
            const item = state.items.find(i => i.id === id);
            item.checked = !item.checked;
            renderItems();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            renderItems();
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                localStorage.setItem('gemini_key', key);
                state.apiKey = key;
                document.getElementById('save-status').classList.remove('hidden');
                setTimeout(() => document.getElementById('save-status').classList.add('hidden'), 2000);
            }
        }

        async function callGemini(prompt) {
            if(!state.apiKey) return { error: "Bitte Key im Setup eingeben!" };
            
            // DEMO MODUS
            if(state.apiKey.toUpperCase() === 'DEMO') {
                await new Promise(r => setTimeout(r, 1500));
                return { text: "Dies ist eine Demo-Antwort. Im echten Workshop wird hier die KI antworten und z.B. vorschlagen, aus deinen Zutaten ein gesundes Omelett zu machen! ✨" };
            }

            const headers = { 'Content-Type': 'application/json' };
            let url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
            if (state.apiKey.startsWith('AIza')) { url += `?key=${state.apiKey}`; } 
            else { headers['Authorization'] = `Bearer ${state.apiKey}`; }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Du bist ein Einkaufs-Assistent. Liste: ${state.items.map(i=>i.name).join(', ')}. Aufgabe: ${prompt}` }] }]
                    })
                });
                const data = await response.json();
                if(!response.ok) return { error: data.error ? data.error.message : "Fehler" };
                return { text: data.candidates[0].content.parts[0].text };
            } catch (e) { return { error: "Netzwerkfehler!" }; }
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const output = document.getElementById('chat-output');
            if(!input.value) return;
            const msg = input.value;
            output.innerHTML += `<div class="flex justify-end"><div class="bg-primary text-white p-4 rounded-3xl rounded-tr-none max-w-[85%] shadow-sm">${msg}</div></div>`;
            input.value = '';
            document.getElementById('ai-loading').classList.remove('hidden');
            const res = await callGemini(msg);
            document.getElementById('ai-loading').classList.add('hidden');
            if(res.error) {
                output.innerHTML += `<div class="bg-red-50 text-red-600 p-4 rounded-2xl text-xs border border-red-100 italic">❌ ${res.error}</div>`;
            } else {
                output.innerHTML += `<div class="flex justify-start"><div class="bg-white border border-gray-100 text-gray-700 p-4 rounded-3xl rounded-tl-none max-w-[85%] shadow-sm">✨ ${res.text}</div></div>`;
            }
            output.scrollTop = output.scrollHeight;
        }

        async function askGemini(prompt) {
            openModal('<div class="flex flex-col items-center p-6"><div class="loader mb-4"></div> <span class="font-bold text-gray-500">KI analysiert deine Liste...</span></div>');
            const res = await callGemini(prompt);
            openModal(`<div class="p-2"><h3 class="font-black text-2xl mb-4 text-primary tracking-tight">KI-Ideen</h3><div class="whitespace-pre-line text-gray-600 leading-relaxed">${res.error ? '❌ ' + res.error : res.text}</div></div>`);
        }

        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.replace('flex', 'hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderItems();
            if(state.apiKey) document.getElementById('api-key-input').value = state.apiKey;
        });
    </script>
</body>
</html>
