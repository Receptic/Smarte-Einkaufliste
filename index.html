<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Einkauf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans pb-24">

    <header class="p-8 pb-4 flex justify-between items-center">
        <h1 class="text-3xl font-black text-slate-800">Smart Einkauf</h1>
        <div id="dot" class="w-3 h-3 rounded-full bg-rose-500 shadow-lg"></div>
    </header>

    <main class="px-6">
        <section id="s-list">
            <div class="flex gap-2 mb-6">
                <input type="text" id="in" placeholder="Artikel..." class="flex-1 p-4 rounded-2xl shadow-sm outline-none border-none">
                <button onclick="add()" class="bg-emerald-500 text-white p-4 rounded-2xl shadow-lg"><i class="fas fa-plus"></i></button>
            </div>
            <div id="list" class="space-y-3"></div>
            <button onclick="ask('Schlage 2 Rezepte vor')" class="w-full mt-10 bg-white border-2 border-emerald-500 text-emerald-500 font-bold py-4 rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sparkles"></i> KI-Vorschläge
            </button>
        </section>

        <section id="s-ki" class="hidden">
            <div class="bg-white rounded-3xl p-6 min-h-[400px] flex flex-col shadow-sm border border-slate-100">
                <div id="out" class="flex-1 text-sm space-y-4 overflow-y-auto mb-4 p-1 text-slate-600 italic">✨ Frag mich was!</div>
                <div id="loading" class="hidden text-emerald-500 text-[10px] mb-2 font-bold animate-pulse">KI denkt nach...</div>
                <div class="flex gap-2 bg-slate-100 p-2 rounded-2xl">
                    <input type="text" id="chat-in" placeholder="Frage..." class="flex-1 bg-transparent p-2 outline-none">
                    <button onclick="send()" class="bg-emerald-500 text-white w-12 h-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <section id="s-set" class="hidden text-center">
            <div class="bg-white rounded-3xl p-8 shadow-sm">
                <h2 class="font-bold text-xl mb-4">Setup</h2>
                <input type="password" id="key-in" placeholder="AIza..." class="w-full p-4 bg-slate-50 rounded-xl border-none mb-4 outline-none text-sm text-center">
                <button onclick="save()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-lg">Speichern</button>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t flex justify-around p-6">
        <button onclick="nav('list')" class="flex flex-col items-center gap-1 text-emerald-500"><i class="fas fa-list text-xl"></i><span class="text-[9px] font-bold">LISTE</span></button>
        <button onclick="nav('ki')" class="flex flex-col items-center gap-1 text-slate-300"><i class="fas fa-robot text-xl"></i><span class="text-[9px] font-bold">KI</span></button>
        <button onclick="nav('set')" class="flex flex-col items-center gap-1 text-slate-300"><i class="fas fa-key text-xl"></i><span class="text-[9px] font-bold">SETUP</span></button>
    </nav>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-6 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-[32px] w-full max-w-md p-8 shadow-2xl overflow-y-auto max-h-[70vh]">
            <div id="m-content" class="text-sm leading-relaxed text-slate-600"></div>
            <button onclick="closeM()" class="w-full mt-8 py-4 bg-emerald-500 text-white rounded-2xl font-bold">Schließen</button>
        </div>
    </div>

    <script>
        let s = {
            i: JSON.parse(localStorage.getItem('i')) || [{id:1, name:'Brot', c:false}, {id:2, name:'Eier', c:false}],
            k: localStorage.getItem('k') || ''
        };

        function nav(id) {
            document.querySelectorAll('section').forEach(x => x.classList.add('hidden'));
            document.getElementById('s-' + id).classList.remove('hidden');
        }

        function render() {
            const l = document.getElementById('list');
            l.innerHTML = '';
            s.i.forEach(x => {
                const d = document.createElement('div');
                d.className = `bg-white p-5 rounded-2xl flex items-center justify-between shadow-sm ${x.c ? 'opacity-30' : ''}`;
                d.innerHTML = `<div class="flex items-center gap-4" onclick="toggle(${x.id})">
                    <div class="w-6 h-6 rounded-full border-2 border-emerald-500 flex items-center justify-center">
                        ${x.c ? '<div class="w-3 h-3 bg-emerald-500 rounded-full"></div>' : ''}
                    </div>
                    <span class="${x.c ? 'line-through' : 'font-bold'}">${x.name}</span>
                </div>
                <button onclick="del(${x.id})" class="text-slate-200"><i class="fas fa-trash"></i></button>`;
                l.appendChild(d);
            });
            localStorage.setItem('i', JSON.stringify(s.i));
            document.getElementById('dot').className = s.k ? 'w-3 h-3 rounded-full bg-emerald-400' : 'w-3 h-3 rounded-full bg-rose-400';
        }

        function add() {
            const v = document.getElementById('in').value;
            if(!v) return;
            s.i.unshift({id: Date.now(), name: v, c: false});
            document.getElementById('in').value = '';
            render();
        }

        function toggle(id) {
            const x = s.i.find(a => a.id === id);
            x.c = !x.c;
            render();
        }

        function del(id) {
            s.i = s.i.filter(a => a.id !== id);
            render();
        }

        function save() {
            s.k = document.getElementById('key-in').value.trim();
            localStorage.setItem('k', s.k);
            render();
            alert("Gespeichert!");
        }

        async function go(p) {
            if(!s.k) return {e: "Kein Key!"};
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${s.k}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: `Liste: ${s.i.map(x=>x.name).join(',')}. Aufgabe: ${p}`}]}]})
                });
                const d = await r.json();
                if(!r.ok) return {e: d.error ? d.error.message : "Fehler"};
                return {t: d.candidates[0].content.parts[0].text};
            } catch (e) { return {e: "Netzwerkfehler!"}; }
        }

        async function send() {
            const i = document.getElementById('chat-in');
            const o = document.getElementById('out');
            if(!i.value) return;
            const m = i.value;
            o.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-500 text-white p-4 rounded-2xl rounded-tr-none max-w-[85%]">${m}</div></div>`;
            i.value = '';
            document.getElementById('loading').classList.remove('hidden');
            const res = await go(m);
            document.getElementById('loading').classList.add('hidden');
            o.innerHTML += `<div class="flex justify-start"><div class="bg-white border p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm">✨ ${res.e ? 'Fehler: ' + res.e : res.t}</div></div>`;
            o.scrollTop = o.scrollHeight;
        }

        async function ask(p) {
            document.getElementById('m-content').innerHTML = '<div class="text-center p-4"><i class="fas fa-spinner fa-spin mr-2"></i> KI denkt nach...</div>';
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            const res = await go(p);
            document.getElementById('m-content').innerHTML = `<h3 class="font-black text-xl mb-4 text-emerald-500 italic">KI-Vorschlag</h3><div class="whitespace-pre-line">${res.e ? 'Fehler: ' + res.e : res.t}</div>`;
        }

        function closeM() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            if(s.k) document.getElementById('key-in').value = s.k;
        });
    </script>
</body>
</html>
