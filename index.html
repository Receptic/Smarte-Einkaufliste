<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Einkauf</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="theme-color-meta" content="#22c55e">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3737/3737372.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #22c55e; }
        .bg-primary { background-color: var(--primary-color); }
        .text-primary { color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }
        body { font-family: sans-serif; background-color: #f9fafb; padding-bottom: 90px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .hidden-section { display: none; }
        .nav-item.active { color: var(--primary-color); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary-color); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Workshop Banner -->
    <div id="workshop-banner" class="bg-yellow-100 border-b border-yellow-200 p-4 mb-4 flex justify-between items-center">
        <div>
            <h3 class="font-bold text-yellow-800 text-sm">🛠 Workshop Challenge</h3>
            <p class="text-[10px] text-yellow-700">Passe Name, Farbe & KI an!</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-yellow-800 text-xl">&times;</button>
    </div>

    <header class="p-6">
        <h1 id="app-title" class="text-3xl font-extrabold text-gray-800">Smart Einkauf</h1>
        <p id="app-greeting" class="text-gray-500 text-sm">Was möchtest du heute einkaufen?</p>
    </header>

    <main class="px-4">
        <!-- SEKTION 1: EINKAUF -->
        <section id="section-einkauf">
            <div class="flex gap-2 mb-6">
                <input type="text" id="item-input" placeholder="Artikel..." class="flex-1 p-3 rounded-xl border-none shadow-sm outline-none">
                <button onclick="addItem()" class="bg-primary text-white p-3 rounded-xl px-5"><i class="fas fa-plus"></i></button>
            </div>
            <div id="shopping-list" class="space-y-3"></div>
            <button onclick="askGeminiForRecipes()" class="w-full mt-6 bg-white border-2 border-primary text-primary font-bold py-4 rounded-2xl flex items-center justify-center gap-2">
                <i class="fas fa-utensils"></i> Was kann ich daraus kochen?
            </button>
        </section>

        <!-- SEKTION 2: KI-ASSISTENT -->
        <section id="section-ki" class="hidden-section">
            <div class="card p-4 min-h-[300px] flex flex-col">
                <div id="chat-output" class="flex-1 text-sm space-y-4 overflow-y-auto mb-4">
                    <div class="bg-gray-100 p-3 rounded-lg text-gray-600 italic">✨ Frag mich etwas über deine Ernährung!</div>
                </div>
                <div id="ai-loading" class="hidden flex items-center gap-2 text-primary text-xs mb-2">
                    <div class="loader"></div> Gemini denkt nach...
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Frage stellen..." class="flex-1 p-3 bg-gray-50 rounded-xl outline-none">
                    <button onclick="sendChat()" class="bg-primary text-white p-3 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- SEKTION 3: IDEEN -->
        <section id="section-ideen" class="hidden-section">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="quickAction('Schnelles Abendessen')" class="card p-4 text-left"><div class="text-2xl">⏱️</div><div class="font-bold text-sm">Schnell</div></button>
                <button onclick="quickAction('Gesunde Alternativen')" class="card p-4 text-left"><div class="text-2xl">🥗</div><div class="font-bold text-sm">Gesund</div></button>
                <button onclick="quickAction('Vegetarische Ideen')" class="card p-4 text-left"><div class="text-2xl">🥦</div><div class="font-bold text-sm">Veggie</div></button>
                <button onclick="quickAction('Günstig kochen')" class="card p-4 text-left"><div class="text-2xl">💶</div><div class="font-bold text-sm">Günstig</div></button>
            </div>
        </section>

        <!-- SEKTION 4: SETUP -->
        <section id="section-settings" class="hidden-section">
            <div class="card p-6">
                <h2 class="font-bold mb-4 text-gray-700">Meine Prioritäten</h2>
                <div id="preferences" class="space-y-2 mb-6">
                    <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"><span>Gesünder</span><input type="checkbox" value="Gesund" onchange="savePrefs()" class="w-5 h-5"></label>
                    <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"><span>Vegetarisch</span><input type="checkbox" value="Vegetarisch" onchange="savePrefs()" class="w-5 h-5"></label>
                    <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"><span>Günstiger</span><input type="checkbox" value="Günstig" onchange="savePrefs()" class="w-5 h-5"></label>
                </div>
                
                <div class="p-4 bg-gray-100 rounded-xl border-2 border-dashed border-gray-300">
                    <p class="text-[10px] text-gray-500 uppercase font-bold text-center mb-2">Entwickler-Optionen</p>
                    <input type="password" id="api-key-input" placeholder="API Key hier einfügen" class="w-full p-3 text-sm rounded-lg border mb-2 outline-none">
                    <button onclick="saveApiKey()" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold text-sm">Key Speichern</button>
                    <p id="save-status" class="hidden text-center text-green-600 text-[10px] mt-2 font-bold italic">✅ Erfolgreich gespeichert!</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 shadow-2xl">
        <button onclick="showSection('einkauf')" class="nav-item active flex flex-col items-center gap-1"><i class="fas fa-shopping-basket text-xl"></i><span class="text-[10px]">Einkauf</span></button>
        <button onclick="showSection('ki')" class="nav-item flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-robot text-xl"></i><span class="text-[10px]">Assistent</span></button>
        <button onclick="showSection('ideen')" class="nav-item flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-lightbulb text-xl"></i><span class="text-[10px]">Ideen</span></button>
        <button onclick="showSection('settings')" class="nav-item flex flex-col items-center gap-1 text-gray-400"><i class="fas fa-cog text-xl"></i><span class="text-[10px]">Setup</span></button>
    </nav>

    <!-- Modal für KI-Antworten -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 max-h-[80vh] overflow-y-auto relative">
            <div id="modal-content" class="text-gray-700 text-sm leading-relaxed"></div>
            <button onclick="closeModal()" class="w-full mt-6 py-4 bg-gray-100 rounded-2xl font-bold text-gray-800">Schließen</button>
        </div>
    </div>

    <script>
        let state = {
            items: JSON.parse(localStorage.getItem('items')) || [
                { id: 1, name: 'Milch', checked: false, category: 'Milchprodukte' },
                { id: 2, name: 'Äpfel', checked: false, category: 'Obst & Gemüse' }
            ],
            prefs: JSON.parse(localStorage.getItem('prefs')) || [],
            apiKey: localStorage.getItem('gemini_key') || ''
        };

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById('section-' + id).classList.remove('hidden-section');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active', 'text-primary'));
            event.currentTarget.classList.add('active', 'text-primary');
        }

        function renderItems() {
            const list = document.getElementById('shopping-list');
            list.innerHTML = '';
            state.items.forEach(item => {
                const div = document.createElement('div');
                div.className = `card p-4 flex items-center justify-between ${item.checked ? 'opacity-40' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="toggleItem(${item.id})" class="w-6 h-6">
                        <span class="${item.checked ? 'line-through' : 'font-bold'} text-gray-700">${item.name}</span>
                    </div>
                    <button onclick="deleteItem(${item.id})" class="text-red-300"><i class="fas fa-trash"></i></button>
                `;
                list.appendChild(div);
            });
            localStorage.setItem('items', JSON.stringify(state.items));
        }

        function addItem() {
            const val = document.getElementById('item-input').value;
            if (!val) return;
            state.items.unshift({ id: Date.now(), name: val, checked: false });
            document.getElementById('item-input').value = '';
            renderItems();
        }

        function toggleItem(id) {
            const item = state.items.find(i => i.id === id);
            item.checked = !item.checked;
            renderItems();
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            renderItems();
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_key', key);
                state.apiKey = key;
                const status = document.getElementById('save-status');
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 3000);
            }
        }

        function savePrefs() {
            state.prefs = Array.from(document.querySelectorAll('#preferences input:checked')).map(i => i.value);
            localStorage.setItem('prefs', JSON.stringify(state.prefs));
        }

        async function callGemini(prompt) {
            if (!state.apiKey) {
                alert("Bitte erst den API-Key unter 'Setup' eingeben!");
                return { fallback: true };
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Du bist ein Einkaufs-Assistent. Präferenzen: ${state.prefs.join(',')}. Liste: ${state.items.map(i => i.name).join(',')}. ${prompt}` }] }]
                    })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                return { fallback: true };
            }
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const output = document.getElementById('chat-output');
            const loader = document.getElementById('ai-loading');
            if (!input.value) return;

            const msg = input.value;
            output.innerHTML += `<div class="bg-primary text-white p-3 rounded-2xl self-end ml-10 text-right">${msg}</div>`;
            input.value = '';
            loader.classList.remove('hidden');

            const res = await callGemini(msg);
            loader.classList.add('hidden');
            output.innerHTML += `<div class="bg-gray-100 p-3 rounded-2xl mr-10">✨ ${res.fallback ? 'Fehler: Bitte prüfe deinen API-Key.' : res}</div>`;
        }

        async function askGeminiForRecipes() {
            openModal('<div class="flex flex-col items-center"><div class="loader mb-2"></div> Gemini überlegt...</div>');
            const res = await callGemini("Schlage 3 Rezepte basierend auf der Liste vor.");
            openModal(`<h2 class="font-bold text-lg mb-4">Rezeptvorschläge</h2><div class="whitespace-pre-line">${res.fallback ? 'KI nicht erreichbar. Prüfe den API-Key.' : res}</div>`);
        }

        function quickAction(text) {
            showSection('ki');
            document.getElementById('chat-input').value = text;
            sendChat();
        }

        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.replace('flex', 'hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderItems();
            if (state.apiKey) document.getElementById('api-key-input').value = state.apiKey;
            state.prefs.forEach(p => {
                const cb = document.querySelector(`#preferences input[value="${p}"]`);
                if (cb) cb.checked = true;
            });
        });
    </script>
</body>
</html>
